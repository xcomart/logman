[workspace]
resolver = "3"
members = ["crates/*"]
# `vendor/gpui` is a patched dependency, not a member: it keeps its own
# manifest and must not inherit workspace settings.
exclude = ["vendor/gpui"]

# gpui 0.2.2 pins the process at 100% CPU, permanently unresponsive, when a
# Korean IME ends a composition mid-word (the Han/Yeong key) and the user then
# keeps typing. gpui's Windows message loop never calls `TranslateMessage`;
# instead it fabricates a `MSG` and translates it re-entrantly from inside the
# window procedure. TSF depends on the documented loop order, and the
# violation leaves CTF regenerating `WM_IME_COMPOSITION` forever from inside a
# `GetMessageW` callback — where no application code can intervene.
#
# The fix is two lines in `vendor/gpui`, both marked `LOGMAN PATCH`:
#   * `platform/windows/platform.rs` — translate in the loop, on the real MSG.
#   * `platform/windows/events.rs`   — drop the in-procedure translations.
#
# More patches, in `platform/linux/x11/` (also marked `LOGMAN PATCH`), two of
# them for the same re-entrancy disease in the X11 backend and two for what the
# X11 window never told the compositor:
#   * `client.rs` — the WM_DELETE_WINDOW close callback ran while the client
#     RefCell was held, so an app that quits from its window-closed observer
#     — as this one does — re-entered the borrow and panicked on every close
#     of the last window.
#   * `window.rs` — `request_decorations` invoked the appearance-changed
#     callback synchronously while `handle_input` held the window callbacks
#     RefCell, so flipping the title-bar setting from its dialog's save
#     button crashed the app; the callback now runs on the next loop turn.
#   * `window.rs` — `is_transparent` ignored client-side decorations, unlike
#     its Wayland counterpart, so the transparent shadow band around a
#     self-decorated window composited as solid black.
#   * `window.rs` — the X11 backend has no counterpart to the Wayland one's
#     `org_kde_kwin_blur`, so a blurred background appearance did nothing on
#     KDE X11; `update_blur_region` now keeps KWin's
#     `_KDE_NET_WM_BLUR_BEHIND_REGION` in step with the window.
#
# crates.io has no newer gpui (0.2.2 is current), so vendoring is the only
# route. Delete these patches and `vendor/gpui` once a release carries them.
[patch.crates-io]
gpui = { path = "vendor/gpui" }

[workspace.package]
version = "0.2.6"
edition = "2024"
license = "Apache-2.0"
authors = ["logman contributors"]
repository = "https://github.com/xcomart/logman"

[workspace.dependencies]
# --- shared utilities ---
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
keyring = "4"
parking_lot = "0.12"
smallvec = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
futures = "0.3"
async-trait = "0.1"
bitflags = "2"
tempfile = "3"
# Unix-only, and used only where a raw syscall is unavoidable: clearing
# `O_NONBLOCK` on a pty master, and reading the passwd entry.
libc = "0.2"

# --- localization ---
# `rust-i18n` compiles `crates/logman-app/locales/*.yml` into the binary, so
# there is no runtime asset to ship; `sys-locale` is only consulted when the
# user has not pinned a language in `settings.json`.
rust-i18n = "4"
sys-locale = "0.3"

# --- async runtime (SSH transport only) ---
# `fs` is needed by the SFTP layer only: file transfers stream through
# `tokio::fs` so a multi-gigabyte copy never blocks the session worker.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "fs",
] }

# --- SSH.  NOTE: default features pull in `aws-lc-rs`, whose build requires
# NASM on Windows.  The `ring` backend builds everywhere with no extra tooling. ---
russh = { version = "0.62", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }

# --- SFTP.  Rides on a russh channel with the `sftp` subsystem requested, so
# it inherits the transport (and the crypto backend) chosen above. ---
russh-sftp = "2.3"

# --- terminal emulation (same engine Zed uses) ---
alacritty_terminal = "0.26"

# --- GUI: Zed's GPU-accelerated UI framework ---
gpui = "0.2.2"

# --- internal crates ---
logman-core = { path = "crates/logman-core" }
logman-pty = { path = "crates/logman-pty" }
logman-ssh = { path = "crates/logman-ssh" }
logman-term = { path = "crates/logman-term" }

[profile.dev]
# gpui + its dependency tree is large; keep debug builds usable.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
