<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    The application mark as the title bar draws it: the prompt chevron and the
    block cursor of `assets/icon.svg`, without that file's tile.

    The tile is what makes the shipped icon read on a desktop, and what made it
    disappear in the title bar: its own dark background sat on a dark chrome and
    left only the chevron showing. Here the mark is a monochrome sprite the bar
    tints from the theme, so it carries the same contrast as every other icon in
    the row, in every theme.

    Proportions are `icon.svg`'s, scaled from its 256 viewBox to this one; the
    stroke is heavier than that scaling gives, because 16 px is where this is
    read and a 1.5 px stroke is what survives there.
  -->
  <path d="M7 8 L11.4 12 L7 16"
        fill="none" stroke="#000" stroke-width="2.4"
        stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="13.4" y="14" width="5.6" height="2.4" rx="1.2" fill="#000"/>
</svg>
