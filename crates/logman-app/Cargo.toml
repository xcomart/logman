[package]
name = "logman-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "logman"
path = "src/main.rs"

# Embeds assets/icon.ico into the Windows executable. gpui loads icon
# resource ID 1 for the window class, so one embedded icon covers Explorer,
# the taskbar and the window itself.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
logman-core.workspace = true
logman-ssh.workspace = true
logman-term.workspace = true

anyhow.workspace = true
async-trait.workspace = true
russh.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
parking_lot.workspace = true
unicode-segmentation.workspace = true
futures.workspace = true
gpui.workspace = true
