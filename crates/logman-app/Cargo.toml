[package]
name = "logman-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "logman"
path = "src/main.rs"

# Embeds assets/icon.ico into the Windows executable. gpui loads icon
# resource ID 1 for the window class, so one embedded icon covers Explorer,
# the taskbar and the window itself.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Used only by `src/caption.rs`, to colour the DWM title bar from the app theme.
# `windows` is pinned to the same 0.61 gpui already links, so this adds no
# second copy of the bindings to the tree; `raw-window-handle` is how gpui hands
# out the `HWND`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Graphics_Dwm"] }
raw-window-handle = "0.6"

# The local-shell transport, behind `src/session.rs`'s local target. Unix-only
# because a pty is: `logman-pty` compiles to nothing at all elsewhere, and the
# feature is gated on `cfg(unix)` all the way up to the connection dialog, so a
# Windows build simply has no local terminal in it.
[target.'cfg(unix)'.dependencies]
logman-pty.workspace = true

# Used only by `src/caption.rs`, to pin the AppKit title bar to the app theme.
# `objc` matches the 0.2 gpui already links on macOS, so the Objective-C runtime
# shim is shared rather than duplicated; `raw-window-handle` is how gpui hands
# out the `NSView`.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"

[dependencies]
logman-core.workspace = true
logman-ssh.workspace = true
logman-term.workspace = true

anyhow.workspace = true
async-trait.workspace = true
# Only for the remote file panel's save dialog, which opens in the user's home
# directory; the configuration paths themselves live in `logman-core`.
directories.workspace = true
russh.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
parking_lot.workspace = true
unicode-segmentation.workspace = true
# Only for the file panel's "is this name too long to fit?" estimate. A CJK name
# takes twice the width of a Latin one at the same character count, so counting
# characters alone would miss exactly the names most likely to be cut off.
unicode-width.workspace = true
futures.workspace = true
gpui.workspace = true
rust-i18n.workspace = true
sys-locale.workspace = true

[dev-dependencies]
# The file panel's upload planner walks a real tree, symlinks included, so the
# test builds one rather than mocking the filesystem out.
tempfile.workspace = true
# gpui's headless test platform, for the widget behaviour that only exists once
# an element tree is laid out and hit-tested -- hover-revealed controls, and
# which of two stacked hitboxes answers a press. Test-only: the binary links
# gpui without it.
gpui = { workspace = true, features = ["test-support"] }
